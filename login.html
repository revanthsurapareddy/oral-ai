<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI Scan - Secure Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Shared styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-logo {
            display: flex;
            align-items: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a81f6 0%, #00c6ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
        }

        .heartbeat-svg {
            width: 60%;
            height: 60%;
        }

        .brand-text {
            font-size: 28px;
            font-weight: 700;
        }

        .brand-text span {
            color: #00c6ff;
        }

        .auth-card {
            background-color: #151e2b;
            border: 1px solid #1f2c3b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h2 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-header p {
            color: #7b8e9f;
            font-size: 14px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #6a7c92;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            background-color: #0b111a;
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: #00c6ff;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #7b8e9f;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            cursor: pointer;
        }

        .forgot-password {
            color: #00c6ff;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(to right, #2a81f6, #00c6ff);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn svg {
            margin-left: 8px;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #7b8e9f;
        }

        .toggle-auth a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-auth a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff4b4b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        
        .success-message {
            color: #00e676;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        /* Forgot Password Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 17, 26, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #151e2b;
            border: 1px solid #1f2c3b;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #7b8e9f;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="header-logo">
        <div class="logo-circle">
            <svg viewBox="0 0 100 100" class="heartbeat-svg">
                <path d="M 20 50 L 35 50 L 45 30 L 55 70 L 65 50 L 80 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="brand-text">Oral<span>AI</span></div>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">Secure Portal Login</h2>
            <p id="auth-subtitle">Enter your hospital credentials to continue</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">DOCTOR ID / EMAIL</label>
                <input class="form-input" type="email" id="email" required placeholder="doctor@hospital.com">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">PASSWORD</label>
                <input class="form-input" type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="javascript:void(0)" id="forgot-password-link" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">Sign In</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
        </form>

        <div class="toggle-auth">
            <span>Don't have an account?</span> 
            <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgot-modal">
        <div class="modal-card">
            <button class="modal-close" id="modal-close-btn">&times;</button>
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your registered email to receive a password reset link.</p>
            </div>
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="reset-email">DOCTOR ID / EMAIL</label>
                    <input class="form-input" type="email" id="reset-email" required placeholder="doctor@hospital.com">
                </div>
                <button type="submit" class="submit-btn" id="reset-submit-btn">
                    <span id="reset-btn-text">Send Reset Link</span>
                </button>
                <div class="error-message" id="reset-error-message"></div>
                <div class="success-message" id="reset-success-message"></div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
