<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI - View Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .header i {
            margin-right: 15px;
            cursor: pointer;
        }

        .container {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scan-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scan-label {
            color: #7b8e9f;
            font-size: 13px;
        }

        .scan-image {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            min-height: 150px;
            background-color: #151e2b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7b8e9f;
        }

        .result-card {
            background-color: #151e2b;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .risk-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .risk-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .risk-icon.high {
            background-color: rgba(255, 75, 75, 0.15);
            color: #ff4b4b;
        }
        
        .risk-icon.low {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .risk-title {
            font-size: 18px;
            font-weight: 600;
        }

        .risk-title.high { color: #ff4b4b; }
        .risk-title.low { color: #10b981; }

        .risk-subtitle {
            font-size: 13px;
            color: #7b8e9f;
            margin-top: 2px;
        }

        .details-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .details-text {
            font-size: 14px;
            color: #7b8e9f;
            line-height: 1.6;
        }

        .btn-delete {
            width: 100%;
            background-color: #ff4b4b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-save {
            flex: 1;
            background-color: #4ade80;
            color: white;
            border: none;
        }

        .btn-share {
            flex: 1;
            background-color: #f59e0b;
            color: white;
            border: none;
        }

        .patient-info-block {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #1f2c3b;
        }

        .info-row {
            font-size: 14px;
            color: #7b8e9f;
            margin-bottom: 6px;
        }

        @media print {
            .btn-delete, .btn-row, .header i {
                display: none !important;
            }
            body {
                padding-bottom: 0;
            }
        }
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 17, 26, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #00c6ff;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading-overlay">Loading report...</div>

    <div class="header">
        <i data-lucide="arrow-left" onclick="history.back()"></i>
        Past Report
    </div>

    <div class="container">
        <!-- In the past report, we only have the analyzed scan saved in DB to save space -->
        <div class="scan-section">
            <div class="scan-label">Analyzed Scan</div>
            <img id="analyzed-scan" class="scan-image" src="" alt="No Image Available">
        </div>

        <div class="result-card">
            <div class="risk-header">
                <div class="risk-icon" id="risk-icon">
                    <i data-lucide="alert-triangle"></i>
                </div>
                <div>
                    <div class="risk-title" id="risk-title">--</div>
                    <div class="risk-subtitle" id="risk-subtitle">--</div>
                </div>
            </div>

            <div class="details-title">Details</div>
            <div class="details-text" id="details-text">
                --
            </div>
            
            <div class="patient-info-block">
                <div class="details-title">Patient Info</div>
                <div class="info-row" id="info-id">ID: --</div>
                <div class="info-row" id="info-name">Name: --</div>
                <div class="info-row" id="info-age">Age: --</div>
                <div class="info-row" id="info-gender">Gender: --</div>
            </div>
            
            <div style="margin-top: 15px; font-size: 12px; color: #6a7c92;">
                Analysis Date: <span id="analysis-date">--</span>
            </div>
        </div>

        <button class="btn-delete" id="btn-delete">Delete Report</button>

        <div class="btn-row">
            <button class="action-btn btn-save">Save PDF</button>
            <button class="action-btn btn-share">Share</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Initialize Supabase Client
        const SUPABASE_URL = 'https://gduqgsxwcnrzdjqkextl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1V-1Pqu_6ZKe4I3MDadz1w_0fUURFdo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchReport() {
            const params = new URLSearchParams(window.location.search);
            const reportId = params.get('report_id');

            if (!reportId) {
                alert("No report ID provided.");
                window.location.href = 'patients.html';
                return;
            }

            try {
                // Fetch the specific report and join patient data
                const { data: report, error } = await supabaseClient
                    .from('reports')
                    .select('*, patients(mrn, full_name, age, gender)')
                    .eq('id', reportId)
                    .single();

                document.getElementById('loading-overlay').style.display = 'none';

                if (error || !report) {
                    throw error || new Error("Report not found");
                }

                if (report.scan_image_url) {
                    document.getElementById('analyzed-scan').src = report.scan_image_url;
                }

                const riskIcon = document.getElementById('risk-icon');
                const riskTitle = document.getElementById('risk-title');
                
                if (report.has_cancer || report.risk_level === 'High') {
                    riskIcon.className = 'risk-icon high';
                    riskIcon.innerHTML = '<i data-lucide="alert-triangle"></i>';
                    riskTitle.className = 'risk-title high';
                    riskTitle.textContent = 'Cancer Detected (High Risk)';
                    document.getElementById('risk-subtitle').textContent = `High Risk (${report.risk_percentage || 96}%)`;
                    document.getElementById('details-text').textContent = "The AI model has detected anomalous tissue structures in the highlighted region. Based on the confidence score, this represents a High risk. Immediate clinical evaluation and biopsy are recommended.";
                } else {
                    riskIcon.className = 'risk-icon low';
                    riskIcon.innerHTML = '<i data-lucide="check-circle"></i>';
                    riskTitle.className = 'risk-title low';
                    riskTitle.textContent = 'No Anomalies Detected';
                    document.getElementById('risk-subtitle').textContent = `Low Risk (${report.risk_percentage || 5}%)`;
                    document.getElementById('details-text').textContent = "The AI model did not detect any immediate signs of oral cancer in the provided scan. Routine checkups are recommended to maintain oral health.";
                }

                // Populate Patient Info
                if (report.patients) {
                    document.getElementById('info-id').textContent = `ID: ${report.patients.mrn}`;
                    document.getElementById('info-name').textContent = `Name: ${report.patients.full_name}`;
                    document.getElementById('info-age').textContent = `Age: ${report.patients.age}`;
                    document.getElementById('info-gender').textContent = `Gender: ${report.patients.gender}`;
                }

                if (report.analysis_date) {
                    const dateObj = new Date(report.analysis_date);
                    document.getElementById('analysis-date').textContent = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();
                }

                lucide.createIcons();

                // Setup Delete Button
                document.getElementById('btn-delete').onclick = async () => {
                    const confirmDelete = confirm("Are you sure you want to completely delete this report?");
                    if (confirmDelete) {
                        try {
                            document.getElementById('loading-overlay').style.display = 'flex';
                            document.getElementById('loading-overlay').textContent = 'Deleting...';
                            const { error: delError } = await supabaseClient.from('reports').delete().eq('id', reportId);
                            if (delError) throw delError;
                            
                            // Navigate back to the patient's reports list
                            window.location.href = `patient_reports.html?patient_id=${report.patient_id}`;
                        } catch (err) {
                            console.error(err);
                            alert("Failed to delete report.");
                            document.getElementById('loading-overlay').style.display = 'none';
                        }
                    }
                };

                // Setup PDF and Share
                document.querySelector('.btn-save').addEventListener('click', () => {
                    window.print();
                });

                document.querySelector('.btn-share').addEventListener('click', async () => {
                    if (navigator.share) {
                        try {
                            const title = document.getElementById('risk-title').textContent;
                            await navigator.share({
                                title: 'OralAI Scan Report',
                                text: `Scan Report for ${report.patients ? report.patients.full_name : 'Patient'}:\n${title}`,
                                url: window.location.href
                            });
                        } catch (err) {}
                    } else {
                        alert("The Web Share API is not supported on this browser.");
                    }
                });

            } catch (err) {
                console.error(err);
                document.getElementById('loading-overlay').style.display = 'none';
                alert("Failed to load report from database.");
            }
        }

        fetchReport();
    </script>
</body>
</html>
