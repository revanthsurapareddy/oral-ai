<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI - Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .header i {
            margin-right: 15px;
            cursor: pointer;
        }

        .container {
            padding: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            font-size: 14px;
            color: #7b8e9f;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #151e2b;
            border-radius: 8px;
            padding: 0 15px;
        }
        
        .input-wrapper i.left-icon {
            color: #7b8e9f;
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .input-wrapper i.right-icon {
            color: #7b8e9f;
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            padding: 16px 0;
            outline: none;
        }
        
        .btn-save {
            width: 100%;
            background-color: #151e2b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        .btn-save:hover {
            background-color: #1f2c3b;
        }

        .error-message {
            color: #ff4b4b;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success-message {
            color: #10b981;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <i data-lucide="arrow-left" onclick="history.back()"></i>
        Change Password
    </div>

    <div class="container">
        <div class="input-group">
            <label class="input-label">New Password</label>
            <div class="input-wrapper">
                <i data-lucide="lock" class="left-icon"></i>
                <input type="password" id="new-password" class="input-field" placeholder="Enter new password">
                <i data-lucide="eye-off" class="right-icon" id="toggle-new"></i>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Re-enter Password</label>
            <div class="input-wrapper">
                <i data-lucide="lock" class="left-icon"></i>
                <input type="password" id="confirm-password" class="input-field" placeholder="Re-enter new password">
                <i data-lucide="eye-off" class="right-icon" id="toggle-confirm"></i>
            </div>
        </div>
        
        <div id="error-msg" class="error-message">Passwords do not match</div>
        <div id="success-msg" class="success-message">Password updated successfully!</div>

        <button class="btn-save" id="btn-save">Save Changes</button>
    </div>

    <script>
        lucide.createIcons();
        
        // Toggle Password Visibility
        function setupToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            
            toggle.addEventListener('click', () => {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggle.setAttribute('data-lucide', 'eye');
                } else {
                    input.type = 'password';
                    toggle.setAttribute('data-lucide', 'eye-off');
                }
                lucide.createIcons();
            });
        }
        
        setupToggle('toggle-new', 'new-password');
        setupToggle('toggle-confirm', 'confirm-password');

        // Initialize Supabase Client
        const SUPABASE_URL = 'https://gduqgsxwcnrzdjqkextl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1V-1Pqu_6ZKe4I3MDadz1w_0fUURFdo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Handle Save
        document.getElementById('btn-save').addEventListener('click', async () => {
            const newPwd = document.getElementById('new-password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const btn = document.getElementById('btn-save');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            if (!newPwd || !confirmPwd) {
                errorMsg.textContent = 'Please fill in both fields.';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (newPwd !== confirmPwd) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (newPwd.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters.';
                errorMsg.style.display = 'block';
                return;
            }
            
            btn.textContent = 'Saving...';
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPwd
                });
                
                if (error) throw error;
                
                successMsg.style.display = 'block';
                document.getElementById('new-password').value = '';
                document.getElementById('confirm-password').value = '';
                
            } catch (error) {
                console.error("Error changing password:", error);
                errorMsg.textContent = error.message || 'Failed to update password.';
                errorMsg.style.display = 'block';
            } finally {
                btn.textContent = 'Save Changes';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
