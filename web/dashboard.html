<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Using Lucide Icons for clean SVGs -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="brand">
            <div class="logo-circle">
                <svg viewBox="0 0 100 100" style="width: 60%; height: 60%;">
                    <path d="M 20 50 L 35 50 L 45 30 L 55 70 L 65 50 L 80 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="brand-text">OralAI</div>
        </div>
        <div class="user-actions">
            <div class="profile-avatar" style="cursor: pointer;" onclick="window.location.href='profile.html'">
                👨‍⚕️
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
        <section class="welcome-section">
            <h1 id="welcome-user-name" class="welcome-title">Welcome back, Doctor</h1>
            <p class="welcome-subtitle">Here's your clinical overview for today.</p>
        </section>

        <button class="new-scan-btn" onclick="window.location.href='upload.html'">
            <i data-lucide="plus"></i> New AI Scan
        </button>

        <div class="stats-grid">
            <!-- Card 1 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-blue">
                    <i data-lucide="users"></i>
                </div>
                <div id="total-patients-value" class="stat-value">0</div>
                <div class="stat-label">Total Patients</div>
                <div class="stat-sublabel" id="total-patients-sub">Active Patients</div>
            </div>

            <!-- Card 2 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-cyan">
                    <i data-lucide="scan"></i>
                </div>
                <div id="scans-today-value" class="stat-value">0</div>
                <div class="stat-label">Scans Performed</div>
            </div>

            <!-- Card 3 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-green">
                    <i data-lucide="activity"></i>
                </div>
                <div class="stat-value">96.5%</div>
                <div class="stat-label">Detection Accuracy</div>
                <div class="stat-sublabel">YOLOv8 Model</div>
            </div>
        </div>

        <!-- Recent Activities Feed on Dashboard -->
        <div style="margin-top: 25px; background: #151e2b; border-radius: 12px; padding: 20px; border: 1px solid #1f2c3b;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 16px; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="clock"></i> Recent Activity Logs
                </h3>
                <a href="profile.html" style="color: #00c6ff; font-size: 13px; text-decoration: none;">View All</a>
            </div>
            <div id="dashboard-activity-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div style="color: #7b8e9f; font-size: 13px; text-align: center; padding: 10px;">Loading recent activities...</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i data-lucide="layout-grid"></i>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <i data-lucide="cloud-upload"></i>
            <span>Upload</span>
        </a>

        <a href="patients.html" class="nav-item">
            <i data-lucide="users"></i>
            <span>Patients</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data_store.js?v=2.0"></script>
    <script>
        lucide.createIcons();

        // Initialize Supabase
        const supabaseUrl = 'https://gduqgsxwcnrzdjqkextl.supabase.co';
        const supabaseKey = 'sb_publishable_1V-1Pqu_6ZKe4I3MDadz1w_0fUURFdo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchDashboardStats() {
            try {
                // Determine doctor name from Supabase Session or localStorage
                let doctorName = localStorage.getItem('oralai_user_name');
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        doctorName = session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || doctorName;
                    }
                } catch(e){}
                
                if (!doctorName || doctorName.trim() === '') {
                    doctorName = 'Doctor';
                }

                const displayName = doctorName.toLowerCase().startsWith('dr') ? doctorName : `Dr. ${doctorName}`;
                document.getElementById('welcome-user-name').innerText = `Welcome back, ${displayName}`;

                // Fetch unified stats from OralAIDataStore
                const stats = OralAIDataStore.getStats();
                document.getElementById('total-patients-value').innerText = stats.totalPatients.toLocaleString();
                document.getElementById('scans-today-value').innerText = stats.totalScans.toLocaleString();

                // Render Dashboard Activity Feed
                const activityContainer = document.getElementById('dashboard-activity-list');
                const activitiesToDisplay = OralAIDataStore.getActivities();

                if (activitiesToDisplay.length === 0) {
                    activityContainer.innerHTML = `
                        <div style="color: #7b8e9f; font-size: 13px; text-align: center; padding: 10px;">
                            No recent activities on localhost. Start an AI scan!
                        </div>`;
                } else {
                    activityContainer.innerHTML = '';
                    activitiesToDisplay.slice(0, 5).forEach(act => {
                        const actDiv = document.createElement('div');
                        const isHigh = act.type === 'high_risk' || (act.description && act.description.includes('High Risk'));
                        actDiv.style.cssText = 'display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #0b111a; border-radius: 8px; font-size: 13px;';
                        actDiv.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i data-lucide="${isHigh ? 'alert-triangle' : 'check-circle'}" style="color: ${isHigh ? '#ff4b4b' : '#10b981'}; width: 18px; height: 18px;"></i>
                                <div>
                                    <div style="color: #ffffff; font-weight: 600;">${act.title}</div>
                                    <div style="color: #7b8e9f; font-size: 12px;">${act.description}</div>
                                </div>
                            </div>
                            <div style="color: #526377; font-size: 11px;">${act.timestamp || 'Recently'}</div>
                        `;
                        activityContainer.appendChild(actDiv);
                    });
                    lucide.createIcons();
                }

            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // Call the fetch function on load and on navigation lifecycle events (BFCache / Back navigation)
        fetchDashboardStats();
        window.addEventListener('pageshow', fetchDashboardStats);
        window.addEventListener('focus', fetchDashboardStats);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) fetchDashboardStats();
        });
    </script>
</body>
</html>
