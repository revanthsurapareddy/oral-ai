<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Using Lucide Icons for clean SVGs -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="brand">
            <div class="logo-circle">
                <svg viewBox="0 0 100 100" style="width: 60%; height: 60%;">
                    <path d="M 20 50 L 35 50 L 45 30 L 55 70 L 65 50 L 80 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="brand-text">OralAI</div>
        </div>
        <div class="user-actions">
            <div class="profile-avatar" style="cursor: pointer;" onclick="window.location.href='profile.html'">
                👨‍⚕️
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
        <section class="welcome-section">
            <h1 id="welcome-user-name" class="welcome-title">Welcome back, Doctor</h1>
            <p class="welcome-subtitle">Here's your clinical overview for today.</p>
        </section>

        <button class="new-scan-btn" onclick="window.location.href='upload.html'">
            <i data-lucide="plus"></i> New AI Scan
        </button>

        <div class="stats-grid">
            <!-- Card 1 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-blue">
                    <i data-lucide="users"></i>
                </div>
                <div id="total-patients-value" class="stat-value">...</div>
                <div class="stat-label">Total Patients</div>
                <div class="stat-sublabel">+12 this week</div>
            </div>

            <!-- Card 2 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-cyan">
                    <i data-lucide="scan"></i>
                </div>
                <div id="scans-today-value" class="stat-value">...</div>
                <div class="stat-label">Scans Today</div>
            </div>

            <!-- Card 3 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-green">
                    <i data-lucide="activity"></i>
                </div>
                <div class="stat-value">96.5%</div>
                <div class="stat-label">Detection Accuracy</div>
                <div class="stat-sublabel">+0.2% vs last month</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i data-lucide="layout-grid"></i>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <i data-lucide="cloud-upload"></i>
            <span>Upload</span>
        </a>

        <a href="patients.html" class="nav-item">
            <i data-lucide="users"></i>
            <span>Patients</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();

        // Initialize Supabase
        const supabaseUrl = 'https://gduqgsxwcnrzdjqkextl.supabase.co';
        const supabaseKey = 'sb_publishable_1V-1Pqu_6ZKe4I3MDadz1w_0fUURFdo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchDashboardStats() {
            try {
                // Determine doctor name from Supabase Session or localStorage
                let doctorName = localStorage.getItem('oralai_user_name');
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    doctorName = session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || doctorName;
                }
                
                if (!doctorName || doctorName.trim() === '') {
                    doctorName = 'Doctor';
                }

                const displayName = doctorName.toLowerCase().startsWith('dr') ? doctorName : `Dr. ${doctorName}`;
                document.getElementById('welcome-user-name').innerText = `Welcome back, ${displayName}`;

                // Fetch Total Patients count
                const { count: patientsCount, error: patientsError } = await supabaseClient
                    .from('patients')
                    .select('*', { count: 'exact', head: true });
                
                if (!patientsError && patientsCount !== null) {
                    document.getElementById('total-patients-value').innerText = patientsCount.toLocaleString();
                }

                // Fetch Scans Today count
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const { count: scansCount, error: scansError } = await supabaseClient
                    .from('reports')
                    .select('*', { count: 'exact', head: true })
                    .gte('analysis_date', today.toISOString());
                
                if (!scansError && scansCount !== null) {
                    document.getElementById('scans-today-value').innerText = scansCount.toLocaleString();
                }
            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // Call the fetch function on load
        fetchDashboardStats();
    </script>
</body>
</html>
