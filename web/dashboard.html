<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralAI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Using Lucide Icons for clean SVGs -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="global_mobile.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="brand">
            <div class="logo-circle">
                <svg viewBox="0 0 100 100" style="width: 60%; height: 60%;">
                    <path d="M 20 50 L 35 50 L 45 30 L 55 70 L 65 50 L 80 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="brand-text">OralAI</div>
        </div>
        <div class="user-actions">
            <div class="profile-avatar" style="cursor: pointer;" onclick="window.location.href='profile.html'">
                👨‍⚕️
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
        <section class="welcome-section">
            <h1 id="welcome-user-name" class="welcome-title">Welcome back, Doctor</h1>
            <p class="welcome-subtitle">Here's your clinical overview for today.</p>
        </section>

        <button class="new-scan-btn" onclick="window.location.href='upload.html'">
            <i data-lucide="plus"></i> New AI Scan
        </button>

        <div class="stats-grid">
            <!-- Card 1 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-blue">
                    <i data-lucide="users"></i>
                </div>
                <div id="total-patients-value" class="stat-value">0</div>
                <div class="stat-label">Total Patients</div>
                <div class="stat-sublabel" id="total-patients-sub">Active Patients</div>
            </div>

            <!-- Card 2 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-cyan">
                    <i data-lucide="scan"></i>
                </div>
                <div id="scans-today-value" class="stat-value">0</div>
                <div class="stat-label">Scans Performed</div>
            </div>

            <!-- Card 3 -->
            <div class="stat-card">
                <div class="icon-wrapper icon-green">
                    <i data-lucide="activity"></i>
                </div>
                <div class="stat-value">96.5%</div>
                <div class="stat-label">Detection Accuracy</div>
                <div class="stat-sublabel">YOLOv8 Model</div>
            </div>
        </div>

        <!-- Recent Activities Feed on Dashboard -->
        <div style="margin-top: 25px; background: #151e2b; border-radius: 12px; padding: 20px; border: 1px solid #1f2c3b;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 16px; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="clock"></i> Recent Activity Logs
                </h3>
                <a href="profile.html" style="color: #00c6ff; font-size: 13px; text-decoration: none;">View All</a>
            </div>
            <div id="dashboard-activity-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div style="color: #7b8e9f; font-size: 13px; text-align: center; padding: 10px;">Loading recent activities...</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i data-lucide="layout-grid"></i>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <i data-lucide="cloud-upload"></i>
            <span>Upload</span>
        </a>

        <a href="patients.html" class="nav-item">
            <i data-lucide="users"></i>
            <span>Patients</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data_store.js?v=3.0"></script>
    <script>
        lucide.createIcons();

        // Initialize Supabase
        const supabaseUrl = 'https://gduqgsxwcnrzdjqkextl.supabase.co';
        const supabaseKey = 'sb_publishable_1V-1Pqu_6ZKe4I3MDadz1w_0fUURFdo';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        function formatDate(dateString) {
            if (!dateString) return 'Recently';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return diffMins + 'm ago';
            if (diffHours < 24) return diffHours + 'h ago';
            
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        async function fetchDashboardStats() {
            try {
                // Determine doctor name from Supabase Session or localStorage
                let doctorName = localStorage.getItem('oralai_user_name');
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        doctorName = session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || doctorName;
                    }
                } catch(e){}
                
                if (!doctorName || doctorName.trim() === '') {
                    doctorName = 'Doctor';
                }

                const displayName = doctorName.toLowerCase().startsWith('dr') ? doctorName : `Dr. ${doctorName}`;
                document.getElementById('welcome-user-name').innerText = `Welcome back, ${displayName}`;

                // Fetch live counts directly from Supabase
                let sbPatientCount = null;
                let sbReportCount = null;
                let liveReports = [];
                try {
                    // Count unique patients from patients and reports tables
                    const { count: pCount } = await supabaseClient
                        .from('patients')
                        .select('*', { count: 'exact', head: true });

                    const { data: patMrns } = await supabaseClient
                        .from('patients')
                        .select('mrn, id, full_name');

                    const { data: repMrns } = await supabaseClient
                        .from('reports')
                        .select('mrn, patient_name');

                    const uniquePatientsSet = new Set();
                    if (patMrns) patMrns.forEach(p => { const k = (p.mrn || p.id || p.full_name || '').trim().toLowerCase(); if (k) uniquePatientsSet.add(k); });
                    if (repMrns) repMrns.forEach(r => { const k = (r.mrn || r.patient_name || '').trim().toLowerCase(); if (k) uniquePatientsSet.add(k); });

                    sbPatientCount = Math.max(pCount || 0, uniquePatientsSet.size);
                    
                    const { count: rCount } = await supabaseClient.from('reports').select('*', { count: 'exact', head: true });
                    if (rCount !== null && rCount !== undefined) sbReportCount = rCount;

                    // Fetch latest 20 reports from Supabase for activity feed
                    const { data: recentReps } = await supabaseClient
                        .from('reports')
                        .select('id, mrn, patient_name, risk_level, risk_percentage, has_cancer, message, analysis_date')
                        .order('analysis_date', { ascending: false })
                        .limit(20);
                    if (recentReps) liveReports = recentReps;
                } catch(e){ console.warn('Supabase fetch error:', e); }

                const stats = OralAIDataStore.getStats();
                const displayPatients = (sbPatientCount !== null && sbPatientCount > 0) ? sbPatientCount : stats.totalPatients;
                const displayScans = (sbReportCount !== null && sbReportCount > 0) ? sbReportCount : stats.totalScans;

                document.getElementById('total-patients-value').innerText = displayPatients.toLocaleString();
                document.getElementById('scans-today-value').innerText = displayScans.toLocaleString();

                // Render Dashboard Activity Feed from LIVE Supabase data
                const activityContainer = document.getElementById('dashboard-activity-list');

                if (liveReports.length > 0) {
                    activityContainer.innerHTML = '';
                    liveReports.forEach(rep => {
                        const isHigh = rep.has_cancer || rep.risk_level === 'High';
                        const dateStr = formatDate(rep.analysis_date);
                        const actDiv = document.createElement('div');
                        actDiv.style.cssText = 'display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #0b111a; border-radius: 8px; font-size: 13px;';
                        actDiv.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i data-lucide="${isHigh ? 'alert-triangle' : 'check-circle'}" style="color: ${isHigh ? '#ff4b4b' : '#10b981'}; width: 18px; height: 18px;"></i>
                                <div>
                                    <div style="color: #ffffff; font-weight: 600;">AI Scan: ${rep.patient_name || 'Patient'} (MRN: ${rep.mrn || '?'})</div>
                                    <div style="color: #7b8e9f; font-size: 12px;">${isHigh ? 'High Risk (' + (rep.risk_percentage || '?') + '%) - Action Recommended' : 'Low Risk (' + (rep.risk_percentage || '?') + '%) - Normal Scan'}</div>
                                </div>
                            </div>
                            <div style="color: #526377; font-size: 11px;">${dateStr}</div>
                        `;
                        activityContainer.appendChild(actDiv);
                    });
                    lucide.createIcons();
                } else {
                    // Fallback to local activities
                    const activitiesToDisplay = OralAIDataStore.getActivities();
                    if (activitiesToDisplay.length === 0) {
                        activityContainer.innerHTML = `<div style="color: #7b8e9f; font-size: 13px; text-align: center; padding: 10px;">No recent activities. Start an AI scan!</div>`;
                    } else {
                        activityContainer.innerHTML = '';
                        activitiesToDisplay.slice(0, 10).forEach(act => {
                            const actDiv = document.createElement('div');
                            const isHigh = act.type === 'high_risk';
                            actDiv.style.cssText = 'display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #0b111a; border-radius: 8px; font-size: 13px;';
                            actDiv.innerHTML = `
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <i data-lucide="${isHigh ? 'alert-triangle' : 'check-circle'}" style="color: ${isHigh ? '#ff4b4b' : '#10b981'}; width: 18px; height: 18px;"></i>
                                    <div>
                                        <div style="color: #ffffff; font-weight: 600;">${act.title}</div>
                                        <div style="color: #7b8e9f; font-size: 12px;">${act.description}</div>
                                    </div>
                                </div>
                                <div style="color: #526377; font-size: 11px;">${formatDate(act.timestamp)}</div>
                            `;
                            activityContainer.appendChild(actDiv);
                        });
                        lucide.createIcons();
                    }
                }

            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // Call the fetch function on load and on navigation lifecycle events (BFCache / Back navigation)
        fetchDashboardStats();
        window.addEventListener('pageshow', fetchDashboardStats);
        window.addEventListener('focus', fetchDashboardStats);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) fetchDashboardStats();
        });
    </script>
</body>
</html>
